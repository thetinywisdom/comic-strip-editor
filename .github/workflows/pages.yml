name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Public client values already used by the frontend.
          # A repository secret of the same name wins over a variable.
          # Empty values do not override the committed .env file.
          # Do not add SUPABASE_SERVICE_ROLE_KEY, LOVABLE_API_KEY, or other server secrets.
          VITE_SUPABASE_URL_SECRET: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY_SECRET: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID_SECRET: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_STATIC_PUBLIC_SECRET: ${{ secrets.VITE_STATIC_PUBLIC }}
          VITE_SUPABASE_URL_VAR: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY_VAR: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID_VAR: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
          VITE_STATIC_PUBLIC_VAR: ${{ vars.VITE_STATIC_PUBLIC }}
        run: |
          set -eu
          apply() {
            name="$1"
            secret_val="$2"
            var_val="$3"
            if [ -n "$secret_val" ]; then
              export "$name=$secret_val"
            elif [ -n "$var_val" ]; then
              export "$name=$var_val"
            fi
          }
          apply VITE_SUPABASE_URL "$VITE_SUPABASE_URL_SECRET" "$VITE_SUPABASE_URL_VAR"
          apply VITE_SUPABASE_PUBLISHABLE_KEY "$VITE_SUPABASE_PUBLISHABLE_KEY_SECRET" "$VITE_SUPABASE_PUBLISHABLE_KEY_VAR"
          apply VITE_SUPABASE_PROJECT_ID "$VITE_SUPABASE_PROJECT_ID_SECRET" "$VITE_SUPABASE_PROJECT_ID_VAR"
          apply VITE_STATIC_PUBLIC "$VITE_STATIC_PUBLIC_SECRET" "$VITE_STATIC_PUBLIC_VAR"
          npm run build
          node scripts/check-pages-build.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
